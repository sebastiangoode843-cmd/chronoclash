name: Build Chronoclash APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip if present
        run: |
          if [ -f Chronoclash.zip ]; then unzip -o -q Chronoclash.zip; fi
          test -f Chronoclash/settings.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: Chronoclash
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Chronoclash-apk
          path: Chronoclash/app/build/outputs/apk/debug/app-debug.apk
